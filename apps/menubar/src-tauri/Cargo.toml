[package]
name = "merit-menubar"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Merit menu-bar recorder: key classes + timing, signed and anchored."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rdev = "0.5"
chrono = "0.4"
dirs = "5"
active-win-pos-rs = "0.9"
