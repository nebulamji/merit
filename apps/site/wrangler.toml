name = "merit-site"
main = "dist/worker.js"
compatibility_date = "2026-06-01"
workers_dev = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[routes]]
pattern = "merit.artofficial.computer"
custom_domain = true

[[durable_objects.bindings]]
name = "BOOK"
class_name = "Book"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Book"]

[vars]
CHAIN_ID = "8453"
PORTFOLIO_EVERY = "100"
PORTFOLIO_HOURS = "24"
PORTFOLIO_PRICE_WEI = "2000000000000000"
MARK_FEE_WEI = "200000000000000"
# Set after the owner deploys from /deploy:
PORTFOLIO_ADDRESS = ""
MARKS_ADDRESS = ""
DAYS_ADDRESS = ""
DAY_RESERVE_WEI = "1000000000000000"
