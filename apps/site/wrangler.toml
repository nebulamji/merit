name = "merit-site"
main = "dist/worker.js"
compatibility_date = "2026-06-01"
workers_dev = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[routes]]
pattern = "merit.artofficial.computer"
custom_domain = true

[[durable_objects.bindings]]
name = "BOOK"
class_name = "Book"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Book"]
