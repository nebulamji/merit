name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: What you did and what you expected }
    validations: { required: true }
  - type: input
    id: system
    attributes: { label: System, placeholder: "macOS 14 arm64 / Windows 11 / Ubuntu 22.04 (X11)" }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Merit version }
  - type: markdown
    attributes: { value: "Please do not paste signing keys, private keys or anything you typed. For security problems use the private reporting channel in SECURITY.md." }
