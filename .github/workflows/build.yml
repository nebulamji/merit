name: build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: cd packages/term && python3 -m unittest test_merit_term
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: cd contracts && forge install OpenZeppelin/openzeppelin-contracts@v5.1.0 foundry-rs/forge-std --no-git && forge test -vv
  app:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest            # one universal build: Apple Silicon and Intel
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: ''
            rust_targets: ''
          - os: ubuntu-22.04
            args: ''
            rust_targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Linux deps
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libxtst-dev libx11-dev libssl-dev libgtk-3-dev patchelf
      - name: Rust tests (signer vector, path confinement)
        run: cargo test --manifest-path apps/menubar/src-tauri/Cargo.toml
      - name: Build installers
        run: pnpm app:ui && pnpm --filter @merit/menubar tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: merit-${{ matrix.os }}
          path: |
            apps/menubar/src-tauri/target/**/bundle/dmg/*.dmg
            apps/menubar/src-tauri/target/**/bundle/msi/*.msi
            apps/menubar/src-tauri/target/**/bundle/nsis/*.exe
            apps/menubar/src-tauri/target/**/bundle/deb/*.deb
            apps/menubar/src-tauri/target/**/bundle/appimage/*.AppImage
  release:
    # A version tag publishes the installers as a (draft) GitHub release: that is the out-of-the-box install.
    needs: app
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Draft release with every installer attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # artifacts keep their bundle folders: attach the installer FILES, not the folders
          mapfile -t files < <(find installers -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \))
          [ ${#files[@]} -gt 0 ] || { echo "no installers found"; exit 1; }
          shasum -a 256 "${files[@]}" | sed 's#installers/.*/##' > SHA256SUMS.txt
          gh release create "${{ github.ref_name }}" "${files[@]}" SHA256SUMS.txt --repo "${{ github.repository }}" --draft --generate-notes --title "Merit ${{ github.ref_name }}"
