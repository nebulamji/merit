name: build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: cd packages/term && python3 -m unittest test_merit_term
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: cd contracts && forge install OpenZeppelin/openzeppelin-contracts@v5.1.0 foundry-rs/forge-std --no-git && forge test -vv
  app:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Linux deps
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libxtst-dev libx11-dev libxi-dev libxcb-randr0-dev libdbus-1-dev
      - name: Rust tests (signer vector, path confinement)
        run: cargo test --manifest-path apps/menubar/src-tauri/Cargo.toml
      - name: Build installers
        run: pnpm app:build
      - uses: actions/upload-artifact@v4
        with:
          name: merit-${{ matrix.os }}
          path: |
            apps/menubar/src-tauri/target/release/bundle/dmg/*.dmg
            apps/menubar/src-tauri/target/release/bundle/msi/*.msi
            apps/menubar/src-tauri/target/release/bundle/nsis/*.exe
            apps/menubar/src-tauri/target/release/bundle/deb/*.deb
            apps/menubar/src-tauri/target/release/bundle/appimage/*.AppImage
